<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記事 — MedBridge 医事ベンチ</title>
<link rel="stylesheet" href="style.css">
<style>
  .article { max-width: 860px; margin: 0 auto; font-size: 15.5px; line-height: 1.9; }
  .article h1 { font-size: 28px; line-height: 1.4; margin: 8px 0 16px; }
  .article h2 { font-size: 21px; margin: 44px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .article h3 { font-size: 17px; margin: 28px 0 8px; }
  .article blockquote { margin: 16px 0; padding: 8px 16px; border-left: 4px solid var(--accent); background: var(--surface); color: var(--muted); }
  .article table { margin: 12px 0; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; display: block; overflow-x: auto; }
  .article img, .article video { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; display: block; margin: 12px 0 4px; }
  .article figcaption, .article .cap { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .article code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .article pre code { padding: 0; background: none; }
</style>
</head>

  <nav><a href="index.html">概要</a><a href="run.html">録画ビューア</a><a href="article.html">記事</a></nav>
</header>
<main><article class="article" id="art">読み込み中…</article></main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
fetch("article.md").then((r) => r.text()).then((md) => {
  document.getElementById("art").innerHTML = marked.parse(md.replace(/<!--[\s\S]*?-->/g, ""));
});
</script>
</body>
